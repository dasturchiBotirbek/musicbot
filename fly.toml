app = "musicbot-botirbek-4386"
primary_region = "fra"

[build]

[env]
  DB_PATH = "/data/bot.db"
  DOWNLOAD_DIR = "/app/downloads"
  MAX_FILE_SIZE_MB = "50"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "bot_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
